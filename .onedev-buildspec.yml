version: 46
jobs:
- name: build
  steps:
  - type: CheckoutStep
    name: Checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Generate Build Number
    runInContainer: true
    image: alpine:latest
    interpreter:
      type: DefaultInterpreter
      commands: |
        VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
        DATE=$(date -u +%Y%m%d)
        echo "${VERSION}-${DATE}.@build_number@" > build_version.txt
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: Set Build Version
    buildVersion: '@file:build_version.txt@'
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: Docker
    output:
      type: RegistryOutput
      tags: '@server@/@project_path@/@project_name@:latest @server@/@project_path@/@project_name@:@build_version@'
    registryLogins:
    - registryUrl: '@server_url@'
      userName: '@job_token@'
      passwordSecret: publish_token
    moreOptions: --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  paramSpecs:
  - type: TextParam
    name: Build Version
    allowEmpty: true
    multiline: false
    defaultValueProvider:
      type: SpecifiedDefaultValue
      value: 1.0.0
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
    paramMatrix:
    - valuesProvider:
        type: IgnoreValues
      secret: false
      name: Build Version
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
