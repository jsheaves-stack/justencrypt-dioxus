version: 44
jobs:
- name: build
  buildVersion: '@groovy:def cargoContent = build.project.readBlobContent(build.commitHash, "Cargo.toml"); def matcher = (cargoContent =~ /(?m)^version\s*=\s*"([^"]+)"/); def baseVersion = matcher.find() ? matcher.group(1) : "0.0.0"; def buildDate = new Date().format("yyyyMMdd"); return "${baseVersion}-${buildDate}.${build.number}"@'
  steps:
  - type: CheckoutStep
    name: Checkout
...
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: Docker
    output:
      type: RegistryOutput
      tags: '@server@/@project_path@/@project_name@:latest @server@/@project_path@/@project_name@:@build_version@'
    registryLogins:
    - registryUrl: '@server_url@'
      userName: '@job_token@'
      passwordSecret: publish_token
    moreOptions: --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
