version: 44
jobs:
- name: build
  steps:
  - type: CheckoutStep
    name: Checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: Set Build Version
    buildVersion: '@param:Build Version@'
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: Docker
    output:
      type: RegistryOutput
      tags: '@server@/@project_path@/@project_name@:latest @server@/@project_path@/@project_name@:@build_version@'
    registryLogins:
    - registryUrl: '@server_url@'
      userName: '@job_token@'
      passwordSecret: publish_token
    moreOptions: --build-arg APP_VERSION=@build_version@
    condition: SUCCESSFUL
    optional: false
  paramSpecs:
  - type: TextParam
    name: Build Version
    allowEmpty: true
    multiline: false
    defaultValueProvider:
      type: ScriptingDefaultValue
      scriptName: builtin:get-build-number
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
    paramMatrix:
    - valuesProvider:
        type: SpecifiedValues
        values:
        - - Pending
      secret: false
      name: Build Version
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
