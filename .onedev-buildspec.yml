version: 53
jobs:
- name: build
  steps:
  - type: CheckoutStep
    name: Checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: BuildImageStep
    name: Docker
    output:
      type: RegistryOutput
      tags: '@server@/@project_path@/@project_name@:latest'
    registryLogins:
    - registryUrl: '@server_url@'
      userName: '@job_token@'
      passwordSecret: publish_token
    moreOptions: --target web
    condition: SUCCESSFUL
    optional: false
  paramSpecs:
  - type: TextParam
    name: Build Version
    allowEmpty: true
    multiline: false
    defaultValueProvider:
      type: SpecifiedDefaultValue
      value: 1.0.0
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
    paramMatrix:
    - valuesProvider:
        type: IgnoreValues
      secret: false
      name: Build Version
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
