[package]
name = "justencrypt-client"
version = "0.1.0"
edition = "2021"
authors = ["Justin Sheaves"]
description = "A file encryption service"
license = "MIT"

[dependencies]
tracing = "0.1.41"
dioxus-logger = "0.7.3"
dioxus-html = { version = "0.7.3", features = ["serialize"] }
reqwest = { version = "0.12.24", features = ["json", "cookies", "stream"] }
async-recursion = "1.1.1"
futures = "0.3.31"
serde_json = "1.0.145"
serde = "1.0.228"
regex = "1.12.2"
base64 = "0.22.1"
async-stream = "0.3.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.3", features = ["desktop", "router"] }
dioxus-desktop = "0.7.3"
tokio = { version = "1.50.0", features = ["fs", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.3", features = ["web", "router"] }
js-sys = "0.3.82"
wasm-streams = "0.4.2"
web-sys = { version = "0.3.91", features = [
  "XmlHttpRequest",
  "XmlHttpRequestEventTarget",
  "ProgressEvent",
  "Event",
  "XmlHttpRequestUpload",
] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.114"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
