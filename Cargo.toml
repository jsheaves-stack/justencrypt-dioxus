[package]
name = "justencrypt-client"
version = "0.1.0"
edition = "2021"
authors = ["Justin Sheaves"]
description = "A file encryption service"
license = "MIT"

[dependencies]
tracing = "0.1.41"
dioxus-logger = "0.7.3"
dioxus-html = { version = "0.7.3", features = ["serialize"] }
reqwest = { version = "0.12.24", features = ["json", "cookies", "stream"] }
serde_json = "1.0.145"
serde = "1.0.228"
base64 = "0.22.1"
futures-util = "0.3.32"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.3", features = ["desktop", "router"] }
dioxus-desktop = "0.7.3"
tokio = { version = "1.50.0", features = ["fs", "io-util"] }
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.3", features = ["web", "router"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.91"
web-sys = { version = "0.3.91", features = [
  "File",
  "Blob",
  "HtmlAnchorElement",
  "Window",
  "Document",
  "HtmlElement",
  "Request",
  "RequestInit",
  "RequestCredentials",
  "Response",
] }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
