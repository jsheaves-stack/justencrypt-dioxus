[package]
name = "justencrypt-client"
version = "0.1.0"
edition = "2021"
authors = ["Justin Sheaves"]
description = "A file encryption service"
license = "MIT"

[dependencies]
tracing = "0.1.41"
dioxus-logger = "0.7.0"
dioxus-html = { version = "0.7.0", features = ["serialize"] }
reqwest = { version = "0.12.24", features = ["json", "cookies", "stream"] }
async-recursion = "1.1.1"
futures = "0.3.31"
serde_json = "1.0.145"
serde = "1.0.228"
regex = "1.12.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.0", features = ["desktop", "router"] }
dioxus-desktop = "0.7.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.0", features = ["web", "router"] }
js-sys = "0.3.82"
wasm-streams = "0.4.2"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"


[patch.crates-io]
dioxus = { path = "../dioxus/packages/dioxus" }
dioxus-web = { path = "../dioxus/packages/web" }
dioxus-core = { path = "../dioxus/packages/core" }
dioxus-html = { path = "../dioxus/packages/html" }
dioxus-signals = { path = "../dioxus/packages/signals" }
generational-box = { path = "../dioxus/packages/generational-box" }
dioxus-hooks = { path = "../dioxus/packages/hooks" }
dioxus-desktop = { path = "../dioxus/packages/desktop" }
